name: Check Warner Bros Studio Tour News

permissions:
  contents: write
  actions: read

on:
  # schedule:
  # - cron: "0 8 * * *"   # daily at 08:00 UTC
  workflow_dispatch:

concurrency:
  group: warner-news-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/scalgary/selenium-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --workdir ${{ github.workspace }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Git setup
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git config user.name "bot"
          git config user.email "bot@github.com"

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4

      - name: Run warner.py
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python warner.py

      - name: Commit updated snapshot and log
        run: |
          git add last_snapshot.json
          git diff --staged --quiet || git commit -m "Update news snapshot"
          git push
